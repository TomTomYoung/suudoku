<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数独ゲーム - Pro Edition</title>
    <style>
        /* ベーススタイル */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
        }

        /* 広告枠スタイル（仮のプレースホルダー） */
        .ad-space {
            width: 100%;
            max-width: 728px; /* 一般的なバナー幅 */
            height: 90px;
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            border: 1px dashed #aaa;
            color: #666;
            font-size: 14px;
        }
        
        .ad-space.victory-ad {
            margin: 20px 0;
            height: 250px; /* レクタングル広告用 */
            background-color: #eee;
        }

        h1 { margin-bottom: 10px; color: #2c3e50; }

        .controls, .difficulty-selector, .seed-controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 入力周りのスタイル調整 */
        .seed-controls input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 120px;
        }

        /* 盤面デザイン */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 40px);
            grid-template-rows: repeat(9, 40px);
            gap: 0;
            border: 3px solid #333;
            margin-bottom: 20px;
            background-color: #333; /* グリッド線の色 */
            position: relative;
        }

        .cell {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background-color: #fff;
            cursor: pointer;
            user-select: none;
            border: 1px solid #ccc; /* 細い線 */
            box-sizing: border-box; /* ボーダーをサイズに含める */
        }

        /* 3x3の太線区切り（CSS Gridのnth-childで制御） */
        .cell:nth-child(3n) { border-right: 2px solid #333; }
        .cell:nth-child(9n) { border-right: none; } /* 右端のリセット */
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #333; }

        /* 修正: グリッドのborder処理をシンプルかつ確実に */
        .sudoku-grid .cell {
            border-right: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
        }
        /* 3列ごとの右ボーダー */
        .sudoku-grid .cell:nth-child(3n) { border-right: 2px solid #333; }
        .sudoku-grid .cell:nth-child(9n) { border-right: 1px solid #ccc; }
        /* 3行ごとの下ボーダー */
        .sudoku-grid {
            border-bottom: 2px solid #333; /* 全体の下枠 */
        }
        /* 行ごとの特定（Grid配置依存のためJSでクラス付与の方が確実だが簡易CSSで対応） */
        /* ※今回は視認性確保のため、元の疑似要素アプローチからシンプルなボーダーへ変更推奨 */
        
        .cell.fixed { font-weight: bold; background-color: #eaeaea; color: #000; cursor: default; }
        .cell.selected { background-color: #bbdefb; }
        .cell.error { color: #e74c3c; background-color: #fadbd8; }
        .cell.same-number { background-color: #e3f2fd; }
        .cell.conflict { background-color: #ffe0e0; }

        body.paused #sudoku-grid {
            pointer-events: none;
            opacity: 0.6;
        }

        body.paused .info #status::after {
            content: '（一時停止中）';
            margin-left: 6px;
            color: #c62828;
            font-weight: bold;
        }

        /* ナンバーパッド */
        .number-pad {
            display: grid;
            grid-template-columns: repeat(5, 50px);
            gap: 8px;
            margin: 10px 0;
        }

        .number {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background-color: #4CAF50;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .number:active { transform: translateY(2px); }
        .number.erase { grid-column: span 5; background-color: #f44336; width: 100%; }

        /* ボタン類 */
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            transition: 0.2s;
        }
        button:hover { opacity: 0.9; }
        button.active { background-color: #0d47a1; font-weight: bold; }

        /* 分析結果エリア */
        .analysis-results {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #ddd;
            background-color: #fff;
            width: 100%;
            max-width: 600px;
            border-radius: 8px;
        }

        /* 勝利モーダル */
        .victory-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .victory-message {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .victory-title { font-size: 28px; color: #4CAF50; margin-bottom: 15px; font-weight: bold; }

        /* レスポンシブ対応 */
        @media (max-width: 500px) {
            .sudoku-grid {
                grid-template-columns: repeat(9, 35px);
                grid-template-rows: repeat(9, 35px);
            }
            .cell { width: 35px; height: 35px; font-size: 18px; }
            .number { width: 40px; height: 40px; font-size: 18px; }
            .number-pad { grid-template-columns: repeat(5, 40px); }
        }
    </style>
</head>
<body>

    <div class="ad-space">
        <p>スポンサー広告 (Google AdSense)</p>
    </div>

    <h1>数独ゲーム Pro</h1>
    
    <div id="timer" class="timer" style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">00:00</div>
    
    <div class="difficulty-selector">
        <button id="easy">簡単</button>
        <button id="medium" class="active">中級</button>
        <button id="hard">難しい</button>
        <button id="analyze-difficulty" style="background-color: #9C27B0;">盤面分析</button>
    </div>

    <div id="analysis-results" class="analysis-results" style="display: none;">
        <h3>📊 盤面分析レポート</h3>
        <div id="analysis-content"></div>
    </div>

    <div class="seed-controls">
        <input type="text" id="seed-input" placeholder="Seed値">
        <button id="use-seed" style="background-color: #607D8B;">生成</button>
        <button id="copy-seed" style="background-color: #607D8B;">コピー</button>
    </div>
    
    <div class="controls">
        <button id="generate" style="background-color: #E91E63;">新規ゲーム</button>
        <button id="check" style="background-color: #FF9800;">チェック</button>
        <button id="hint" style="background-color: #009688;">ヒント</button>
        <button id="pause" style="background-color: #795548;">一時停止</button>
    </div>
    
    <div id="sudoku-grid" class="sudoku-grid"></div>
    
    <div id="number-pad" class="number-pad">
    </div>
    
    <div class="info">
        <p id="status">ゲームを開始してください</p>
    </div>

    <div id="victory-container" class="victory-container">
        <div class="victory-message">
            <div class="victory-title">🎉 CLEAR! 🎉</div>
            <div class="victory-stats" id="victory-stats" style="margin-bottom: 15px; line-height: 1.6;"></div>
            
            <div class="ad-space victory-ad">
                <p>お疲れ様でした！<br>広告表示エリア</p>
            </div>

            <button class="victory-button" id="victory-close" style="width: 100%; padding: 15px; font-size: 18px;">閉じる</button>
        </div>
    </div>

    <script>
        // ==========================================
        //  Core Logic & State
        // ==========================================
        let grid = Array(9).fill().map(() => Array(9).fill(0));
        let solution = Array(9).fill().map(() => Array(9).fill(0));
        let userGrid = Array(9).fill().map(() => Array(9).fill(0));
        let fixedCells = Array(9).fill().map(() => Array(9).fill(false));
        let difficulty = 'medium';
        let selectedCell = null;
        let timer = null;
        let seconds = 0;
        let currentSeed = null;
        let paused = false;

        const STORAGE_KEY = 'sudoku-pro-state-v2';

        // ==========================================
        //  Event Listeners
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            // Buttons
            document.getElementById('easy').addEventListener('click', () => setDifficulty('easy'));
            document.getElementById('medium').addEventListener('click', () => setDifficulty('medium'));
            document.getElementById('hard').addEventListener('click', () => setDifficulty('hard'));
            document.getElementById('analyze-difficulty').addEventListener('click', analyzeDifficulty);
            document.getElementById('use-seed').addEventListener('click', useSeedFromInput);
            document.getElementById('copy-seed').addEventListener('click', copyCurrentSeed);
            document.getElementById('generate').addEventListener('click', startNewGame);
            document.getElementById('check').addEventListener('click', checkSolution);
            document.getElementById('hint').addEventListener('click', giveHint);
            document.getElementById('pause').addEventListener('click', togglePause);
            document.getElementById('victory-close').addEventListener('click', () => {
                document.getElementById('victory-container').style.display = 'none';
            });

            // Number Pad Generation
            const numPad = document.getElementById('number-pad');
            for(let i=1; i<=9; i++){
                const div = document.createElement('div');
                div.className = 'number';
                div.textContent = i;
                div.dataset.number = i;
                div.onclick = () => handleInput(i);
                numPad.appendChild(div);
            }
            // Erase Button
            const eraseBtn = document.createElement('div');
            eraseBtn.className = 'number erase';
            eraseBtn.textContent = '消去';
            eraseBtn.onclick = () => handleInput(0);
            numPad.appendChild(eraseBtn);

            // Keyboard Input
            document.addEventListener('keydown', (e) => {
                if (!selectedCell) return;
                if (paused) return;
                if (e.key >= '1' && e.key <= '9') handleInput(parseInt(e.key));
                if (e.key === '0' || e.key === 'Backspace' || e.key === 'Delete') handleInput(0);
            });

            // Initial Render
            renderGrid();
            if (!loadSavedGame()) {
                startNewGame(); // 自動スタート
            }
        });

        function handleInput(num) {
            if (!selectedCell) return;
            if (paused) return;
            if (!gameActive()) startTimer(); // 初回入力でタイマースタート

            const r = parseInt(selectedCell.dataset.row);
            const c = parseInt(selectedCell.dataset.col);
            if (fixedCells[r][c]) return;

            userGrid[r][c] = num;
            
            // UI更新
            selectedCell.textContent = num === 0 ? '' : num;
            selectedCell.classList.remove('error');
            if (num !== 0 && num !== solution[r][c]) selectedCell.classList.add('error');

            highlightSameNumbers(num);
            updateConflicts();
            checkVictory();
            saveState();
        }

        function gameActive() {
            return timer !== null;
        }

        // ==========================================
        //  Sudoku Generator (The Important Part)
        // ==========================================
        
        class SeededRandom {
            constructor(seed) {
                this.seed = this.hash(seed);
            }
            hash(seed) {
                let str = seed.toString();
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = ((hash << 5) - hash) + str.charCodeAt(i);
                    hash |= 0; 
                }
                return Math.abs(hash);
            }
            random() {
                const x = Math.sin(this.seed++) * 10000;
                return x - Math.floor(x);
            }
            randomInt(min, max) {
                return Math.floor(this.random() * (max - min + 1)) + min;
            }
        }

        function startNewGame() {
            const seed = Math.floor(Math.random() * 1000000000).toString();
            startNewGameWithSeed(seed);
        }

        function startNewGameWithSeed(seed) {
            stopTimer();
            document.getElementById('status').textContent = '生成中...';
            document.getElementById('seed-input').value = seed;
            currentSeed = seed;
            paused = false;
            document.body.classList.remove('paused');
            document.getElementById('pause').textContent = '一時停止';

            // UIブロック回避のためsetTimeout
            setTimeout(() => {
                const rng = new SeededRandom(seed);
                
                // 1. 完全な盤面を作成
                grid = Array(9).fill().map(() => Array(9).fill(0));
                solveSudoku(grid, rng); // バックトラッキングで埋める
                
                // 2. シャッフル（ランダム性向上）
                shuffleSudoku(rng);
                
                // 3. 解答を保持
                solution = grid.map(row => [...row]);

                // 4. 穴あけ（ここが修正ポイント！）
                removeCells(rng);

                // 5. 初期化
                userGrid = grid.map(row => [...row]);
                fixedCells = grid.map(row => row.map(cell => cell !== 0));
                selectedCell = null;
                renderGrid();
                seconds = 0;
                updateTimerDisplay();
                document.getElementById('status').textContent = `スタート！ (Seed: ${seed})`;
                document.getElementById('analysis-results').style.display = 'none';
                saveState();
            }, 10);
        }

        // 再帰的バックトラッキング
        function solveSudoku(board, rng = null) {
            const empty = findEmpty(board);
            if (!empty) return true;
            const [r, c] = empty;

            let nums = [1,2,3,4,5,6,7,8,9];
            if (rng) nums = seededShuffle(nums, rng);

            for (let n of nums) {
                if (isSafe(board, r, c, n)) {
                    board[r][c] = n;
                    if (solveSudoku(board, rng)) return true;
                    board[r][c] = 0;
                }
            }
            return false;
        }

        // ★重要修正★: Hardモードでも一意解を保証する
        function removeCells(rng) {
            let cellsToRemove = 40;
            if(difficulty === 'medium') cellsToRemove = 50;
            if(difficulty === 'hard') cellsToRemove = 58; // 限界に近い数

            const positions = [];
            for(let r=0; r<9; r++) for(let c=0; c<9; c++) positions.push([r,c]);
            const shuffled = seededShuffle(positions, rng);

            let removedCount = 0;
            
            for (let [r, c] of shuffled) {
                if (removedCount >= cellsToRemove) break;

                let backup = grid[r][c];
                grid[r][c] = 0;

                // 【修正】難易度に関わらず必ずチェックする！
                // これで「解が複数ある（解けない）」バグを防ぐ
                if (hasUniqueSolution(grid)) {
                    removedCount++;
                } else {
                    grid[r][c] = backup; // 戻す
                }
            }
        }

        // 解の数を数える（2つ以上あったら即打ち切り）
        function hasUniqueSolution(board) {
            let solutions = 0;
            function count(bd) {
                if (solutions > 1) return; // 2つ見つかったら終了（高速化）
                
                const empty = findEmpty(bd);
                if (!empty) {
                    solutions++;
                    return;
                }
                const [r, c] = empty;
                for (let n = 1; n <= 9; n++) {
                    if (isSafe(bd, r, c, n)) {
                        bd[r][c] = n;
                        count(bd);
                        bd[r][c] = 0;
                    }
                }
            }
            
            // コピーを渡して破壊を防ぐ
            const boardCopy = board.map(row => [...row]);
            count(boardCopy);
            return solutions === 1;
        }

        // ==========================================
        //  Helpers & Utilities
        // ==========================================
        function findEmpty(board) {
            for(let r=0; r<9; r++) for(let c=0; c<9; c++) if(board[r][c]===0) return [r,c];
            return null;
        }

        function isSafe(board, r, c, n) {
            for(let i=0; i<9; i++) {
                if(board[r][i] === n) return false;
                if(board[i][c] === n) return false;
            }
            const br = Math.floor(r/3)*3;
            const bc = Math.floor(c/3)*3;
            for(let i=0; i<3; i++) for(let j=0; j<3; j++) {
                if(board[br+i][bc+j] === n) return false;
            }
            return true;
        }

        function seededShuffle(array, rng) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = rng.randomInt(0, i);
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function shuffleSudoku(rng) {
            // 3x3ブロック内での入れ替え
            const swapInBlock = (isRow) => {
                for (let block = 0; block < 3; block++) {
                    const base = block * 3;
                    const a = base + rng.randomInt(0, 2);
                    let b = base + rng.randomInt(0, 2);
                    if (a === b) b = base + ((b + 1) % 3);
                    for (let i = 0; i < 9; i++) {
                        if (isRow) {
                            [grid[a][i], grid[b][i]] = [grid[b][i], grid[a][i]];
                        } else {
                            [grid[i][a], grid[i][b]] = [grid[i][b], grid[i][a]];
                        }
                    }
                }
            };

            // ブロックの入れ替え
            const swapBlocks = (isRow) => {
                const first = rng.randomInt(0, 2);
                let second = rng.randomInt(0, 2);
                if (first === second) second = (second + 1) % 3;
                for (let offset = 0; offset < 3; offset++) {
                    const a = first * 3 + offset;
                    const b = second * 3 + offset;
                    for (let i = 0; i < 9; i++) {
                        if (isRow) {
                            [grid[a][i], grid[b][i]] = [grid[b][i], grid[a][i]];
                        } else {
                            [grid[i][a], grid[i][b]] = [grid[i][b], grid[i][a]];
                        }
                    }
                }
            };

            swapInBlock(true);
            swapInBlock(false);
            swapBlocks(true);
            swapBlocks(false);
        }

        // ==========================================
        //  UI Functions
        // ==========================================
        function renderGrid() {
            const container = document.getElementById('sudoku-grid');
            container.innerHTML = '';
            selectedCell = null;
            for(let r=0; r<9; r++) {
                for(let c=0; c<9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    // 3x3 border logic applied in CSS via nth-child, but we can enforce simpler borders here if needed.
                    // CSS Grid gap handles the main borders.

                    if(fixedCells[r][c]) {
                        cell.textContent = grid[r][c];
                        cell.classList.add('fixed');
                    } else if(userGrid[r][c] !== 0) {
                        cell.textContent = userGrid[r][c];
                    }
                    
                    cell.onclick = () => {
                        if(selectedCell) selectedCell.classList.remove('selected');
                        selectedCell = cell;
                        cell.classList.add('selected');
                        if(userGrid[r][c] !== 0) highlightSameNumbers(userGrid[r][c]);
                        else highlightSameNumbers(-1); // Clear
                    };
                    container.appendChild(cell);
                }
            }
            updateConflicts();
        }

        function highlightSameNumbers(num) {
            document.querySelectorAll('.same-number').forEach(el => el.classList.remove('same-number'));
            if(num === -1 || num === 0) return;
            document.querySelectorAll('.cell').forEach(cell => {
                const r = cell.dataset.row;
                const c = cell.dataset.col;
                const val = fixedCells[r][c] ? grid[r][c] : userGrid[r][c];
                if(val === num) cell.classList.add('same-number');
            });
        }

        function setDifficulty(level) {
            difficulty = level;
            document.querySelectorAll('.difficulty-selector button').forEach(b => b.classList.remove('active'));
            document.getElementById(level).classList.add('active');
            startNewGame();
        }

        function checkVictory() {
            for(let r=0; r<9; r++) for(let c=0; c<9; c++) {
                if(userGrid[r][c] !== solution[r][c]) return;
            }
            stopTimer();
            document.getElementById('victory-stats').innerHTML =
                `難易度: ${difficulty.toUpperCase()}<br>タイム: ${document.getElementById('timer').textContent}<br>Seed: ${currentSeed}`;
            document.getElementById('victory-container').style.display = 'flex';
            localStorage.removeItem(STORAGE_KEY);
        }

        // ==========================================
        //  Utilities (Timer, Seed, etc.)
        // ==========================================
        function startTimer() {
            if(timer) return;
            timer = setInterval(() => {
                seconds++;
                updateTimerDisplay();
                saveState();
            }, 1000);
        }
        function stopTimer() { clearInterval(timer); timer = null; }

        function updateTimerDisplay() {
            const m = Math.floor(seconds/60).toString().padStart(2,'0');
            const s = (seconds%60).toString().padStart(2,'0');
            document.getElementById('timer').textContent = `${m}:${s}`;
        }
        
        function useSeedFromInput() {
            const val = document.getElementById('seed-input').value.trim();
            if(val) startNewGameWithSeed(val);
        }
        function copyCurrentSeed() {
            navigator.clipboard.writeText(currentSeed);
            alert('シードをコピーしました');
        }
        function giveHint() {
            if(!gameActive()) startTimer();
            // 単純に空きマスを一つ埋める
            const empties = [];
            for(let r=0; r<9; r++) for(let c=0; c<9; c++) if(userGrid[r][c] === 0) empties.push([r,c]);
            if(empties.length === 0) return;
            const [r, c] = empties[Math.floor(Math.random()*empties.length)];
            userGrid[r][c] = solution[r][c];
            renderGrid(); // Re-render to show update
            checkVictory();
            saveState();
        }
        function checkSolution() {
            // エラーを表示
            let errors = 0;
            document.querySelectorAll('.cell').forEach(cell => {
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                if(!fixedCells[r][c] && userGrid[r][c] !== 0) {
                    if(userGrid[r][c] !== solution[r][c]) {
                        cell.classList.add('error');
                        errors++;
                    }
                }
            });
            alert(errors === 0 ? "現在の入力に間違いはありません" : `${errors}箇所の間違いがあります`);
        }

        // ==========================================
        //  Analysis Logic (Honest Version)
        // ==========================================
        function analyzeDifficulty() {
            // フェイク（ランダム判定）を排除し、実測値のみを表示
            let emptyCount = 0;
            for(let r=0; r<9; r++) for(let c=0; c<9; c++) if(grid[r][c]===0) emptyCount++;

            const givens = 81 - emptyCount;

            const html = `
                <div style="margin-bottom:10px;"><strong>空白セル数:</strong> ${emptyCount} / 81</div>
                <div style="margin-bottom:10px;"><strong>与えられた数字:</strong> ${givens}</div>
                <div style="margin-bottom:10px;"><strong>推定難易度:</strong> ${difficulty.toUpperCase()}</div>
                <div style="font-size:12px; color:#666;">※この盤面は論理的に一意の解を持つことが保証されています。</div>
            `;
            document.getElementById('analysis-content').innerHTML = html;
            document.getElementById('analysis-results').style.display = 'block';
        }

        // ==========================================
        //  State Persistence & Conflict Highlighting
        // ==========================================
        function togglePause() {
            paused = !paused;
            if (paused) {
                stopTimer();
                document.body.classList.add('paused');
                document.getElementById('pause').textContent = '再開';
            } else {
                document.body.classList.remove('paused');
                document.getElementById('pause').textContent = '一時停止';
                startTimer();
            }
            saveState();
        }

        function saveState() {
            const state = {
                grid,
                solution,
                userGrid,
                fixedCells,
                difficulty,
                currentSeed,
                seconds,
                running: timer !== null,
                paused,
            };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn('Failed to save state', e);
            }
        }

        function loadSavedGame() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return false;
                const data = JSON.parse(raw);
                if (!data.grid || !data.solution || !data.userGrid) return false;

                grid = data.grid;
                solution = data.solution;
                userGrid = data.userGrid;
                fixedCells = data.fixedCells;
                difficulty = data.difficulty || 'medium';
                currentSeed = data.currentSeed || null;
                seconds = data.seconds || 0;
                paused = !!data.paused;

                document.getElementById('seed-input').value = currentSeed || '';
                document.querySelectorAll('.difficulty-selector button').forEach(b => b.classList.remove('active'));
                document.getElementById(difficulty).classList.add('active');

                renderGrid();
                updateTimerDisplay();
                document.getElementById('status').textContent = currentSeed ? `再開しました (Seed: ${currentSeed})` : '再開しました';

                document.body.classList.toggle('paused', paused);
                document.getElementById('pause').textContent = paused ? '再開' : '一時停止';
                if (data.running && !paused) startTimer();
                return true;
            } catch (e) {
                console.warn('Failed to load state', e);
                return false;
            }
        }

        function updateConflicts() {
            document.querySelectorAll('.cell').forEach(cell => cell.classList.remove('conflict'));

            const conflicts = new Set();
            const addConflicts = (positions) => {
                if (positions.length > 1) {
                    positions.forEach(([r, c]) => conflicts.add(`${r}-${c}`));
                }
            };

            for (let r = 0; r < 9; r++) {
                const rowMap = new Map();
                for (let c = 0; c < 9; c++) {
                    const val = fixedCells[r][c] ? grid[r][c] : userGrid[r][c];
                    if (!val) continue;
                    const arr = rowMap.get(val) || [];
                    arr.push([r, c]);
                    rowMap.set(val, arr);
                }
                rowMap.forEach(addConflicts);
            }

            for (let c = 0; c < 9; c++) {
                const colMap = new Map();
                for (let r = 0; r < 9; r++) {
                    const val = fixedCells[r][c] ? grid[r][c] : userGrid[r][c];
                    if (!val) continue;
                    const arr = colMap.get(val) || [];
                    arr.push([r, c]);
                    colMap.set(val, arr);
                }
                colMap.forEach(addConflicts);
            }

            for (let br = 0; br < 3; br++) {
                for (let bc = 0; bc < 3; bc++) {
                    const blockMap = new Map();
                    for (let r = br * 3; r < br * 3 + 3; r++) {
                        for (let c = bc * 3; c < bc * 3 + 3; c++) {
                            const val = fixedCells[r][c] ? grid[r][c] : userGrid[r][c];
                            if (!val) continue;
                            const arr = blockMap.get(val) || [];
                            arr.push([r, c]);
                            blockMap.set(val, arr);
                        }
                    }
                    blockMap.forEach(addConflicts);
                }
            }

            conflicts.forEach(key => {
                const [r, c] = key.split('-');
                const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
                if (cell) cell.classList.add('conflict');
            });
        }

    </script>
</body>
</html>
